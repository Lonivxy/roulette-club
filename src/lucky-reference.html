<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUCKY 777 — Photorealistic 3D Vegas Slot Machine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Chakra+Petch:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #1c0b19 0%, #09050d 60%, #030206 100%);
      font-family: 'Chakra Petch', sans-serif;
      color: #ffffff;
    }

    #webgl-mount {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .hud-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 18px;
    }

    .interactive {
      pointer-events: auto;
    }

    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    /* Casino Bet Chip Buttons */
    .bet-btn {
      position: relative;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 9px 16px;
      border-radius: 11px;
      border: 2px solid rgba(251, 191, 36, 0.4);
      background: linear-gradient(180deg, #271f36 0%, #110d19 100%);
      color: #fde68a;
      cursor: pointer;
      transition: all 0.14s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .bet-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: #facc15;
      color: #ffffff;
    }

    .bet-btn.active {
      background: linear-gradient(180deg, #fef08a 0%, #f59e0b 55%, #b45309 100%);
      color: #1f070b;
      border-color: #ffffff;
      box-shadow: 0 0 22px rgba(250, 204, 21, 0.85), 0 6px 14px rgba(0, 0, 0, 0.75);
      transform: translateY(-3px) scale(1.05);
    }

    .bet-btn.all-in {
      border-color: rgba(248, 113, 113, 0.65);
      background: linear-gradient(180deg, #7f1d1d 0%, #3b0707 100%);
      color: #fecaca;
    }

    .bet-btn.all-in.active {
      background: linear-gradient(180deg, #fde047 0%, #ef4444 50%, #991b1b 100%);
      color: #ffffff;
      border-color: #fef08a;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      box-shadow: 0 0 28px rgba(239, 68, 68, 0.95), 0 0 14px rgba(250, 204, 21, 0.9);
      animation: pulseAllIn 0.65s infinite alternate;
    }

    .bet-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    @keyframes pulseAllIn {
      from { filter: brightness(1); transform: translateY(-3px) scale(1.05); }
      to { filter: brightness(1.22); transform: translateY(-4px) scale(1.08); }
    }

    .spin-cta-btn {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.92rem;
      letter-spacing: 0.06em;
      padding: 10px 22px;
      border-radius: 12px;
      border: 2px solid #dcfce7;
      background: linear-gradient(180deg, #4ade80 0%, #16a34a 55%, #14532d 100%);
      color: #052e16;
      cursor: pointer;
      box-shadow: 0 0 22px rgba(74, 222, 128, 0.6), 0 6px 14px rgba(0, 0, 0, 0.75);
      transition: all 0.14s ease;
    }

    .spin-cta-btn:hover:not(:disabled) {
      filter: brightness(1.12);
      transform: translateY(-2px);
    }

    .spin-cta-btn:active:not(:disabled) {
      transform: translateY(2px);
    }

    .spin-cta-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Right-side Pull Tension Gauge */
    .tension-pill {
      width: 16px;
      height: 148px;
      background: rgba(8, 7, 14, 0.9);
      border: 2px solid rgba(250, 204, 21, 0.55);
      border-radius: 999px;
      padding: 2px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.85);
    }

    .tension-fill {
      width: 100%;
      height: 0%;
      border-radius: 999px;
      background: linear-gradient(180deg, #ef4444 0%, #facc15 48%, #22c55e 100%);
      transition: height 0.03s linear;
    }
  </style>
</head>
<body>

  <!-- 3D WebGL Viewport -->
  <div id="webgl-mount"></div>

  <!-- Crisp Non-Intrusive HUD -->
  <div class="hud-overlay">

    <!-- Top Bar -->
    <div class="flex flex-wrap items-center justify-between gap-2">
      <!-- Live Readout Pill -->
      <div class="interactive flex items-center gap-3 bg-black/80 backdrop-blur-md border border-amber-400/45 rounded-2xl px-4 py-2 shadow-2xl">
        <div class="pr-3 border-r border-white/15">
          <div class="text-[10px] uppercase tracking-widest text-amber-300/90">Credits</div>
          <div id="uiCredits" class="font-orbitron text-lg sm:text-xl font-black text-emerald-400">1,000</div>
        </div>
        <div class="pr-3 border-r border-white/15">
          <div class="text-[10px] uppercase tracking-widest text-amber-300/90">Active Bet</div>
          <div id="uiBet" class="font-orbitron text-lg sm:text-xl font-black text-yellow-300">100</div>
        </div>
        <div>
          <div class="text-[10px] uppercase tracking-widest text-amber-300/90">Last Win</div>
          <div id="uiWin" class="font-orbitron text-lg sm:text-xl font-black text-amber-400">0</div>
        </div>
        <button id="rebuyBtn" onclick="rebuyCredits()" class="hidden ml-2 px-3 py-1.5 rounded-xl bg-emerald-400 hover:bg-emerald-300 text-black font-orbitron font-black text-xs shadow-lg transition">
          +1,000 REBUY
        </button>
      </div>

      <!-- Center Status Ticker -->
      <div id="statusTicker" class="bg-black/80 backdrop-blur-md border border-amber-400/40 rounded-full px-5 py-2 text-xs sm:text-sm font-bold text-yellow-200 shadow-xl text-center">
        🕹️ Grab & pull down the 3D Red Joystick on the right (or press SPACE / SPIN)!
      </div>

      <!-- Camera & Test Controls -->
      <div class="interactive flex items-center gap-2">
        <div class="flex bg-black/80 border border-amber-400/40 rounded-full p-1 text-xs">
          <button id="camPlay" onclick="setCameraView('play')" class="px-3 py-1 rounded-full bg-amber-400 text-black font-bold transition">Close-Up 3D</button>
          <button id="camLever" onclick="setCameraView('lever')" class="px-3 py-1 rounded-full text-amber-200 hover:bg-white/10 transition">Joystick View</button>
          <button id="camFront" onclick="setCameraView('front')" class="px-3 py-1 rounded-full text-amber-200 hover:bg-white/10 transition">Front</button>
        </div>
        <button onclick="forceJackpot777()" class="px-3 py-1.5 rounded-full bg-red-600 hover:bg-red-500 border border-yellow-300 text-xs font-bold text-yellow-100 shadow-lg transition">
          ⚡ Force 777
        </button>
        <button id="muteBtn" onclick="toggleMute()" class="px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20 border border-white/25 text-xs font-semibold transition">
          🔊 SFX
        </button>
      </div>
    </div>

    <!-- Right-Side Joystick Tension Meter -->
    <div class="fixed right-4 top-1/2 -translate-y-1/2 flex flex-col items-center gap-1.5 pointer-events-none">
      <div class="text-[10px] font-orbitron font-bold tracking-wider text-yellow-300 uppercase bg-black/80 px-2 py-0.5 rounded border border-yellow-500/40">
        Arm Pull
      </div>
      <div class="tension-pill">
        <div id="tensionFill" class="tension-fill"></div>
      </div>
      <div id="tensionPct" class="font-orbitron text-xs font-black text-amber-300">0%</div>
    </div>

    <!-- Bottom Dock: Paytable Reference + 6 Bet Options (10, 50, 100, 500, 1000, ALL IN) -->
    <div class="flex flex-col items-center gap-2">
      <div class="flex flex-wrap justify-center gap-2.5 text-[11px] bg-black/75 backdrop-blur-md border border-amber-400/35 rounded-full px-4 py-1 text-amber-100 shadow-lg">
        <span><b class="text-red-400">777</b> = 50×</span>
        <span>•</span>
        <span><b class="text-sky-300">DIAMOND×3</b> = 25×</span>
        <span>•</span>
        <span><b class="text-yellow-300">BAR×3</b> = 20×</span>
        <span>•</span>
        <span><b class="text-amber-300">BELL×3</b> = 15×</span>
        <span>•</span>
        <span><b class="text-emerald-300">CLOVER×3</b> = 10×</span>
        <span>•</span>
        <span><b class="text-rose-400">CHERRY</b> = 5× / 2× / 1×</span>
      </div>

      <div class="interactive flex flex-wrap items-center justify-center gap-2 bg-black/85 backdrop-blur-md border-2 border-amber-400/55 rounded-2xl px-3.5 py-2 shadow-2xl">
        <span class="text-[11px] font-orbitron uppercase tracking-wider text-amber-300 mr-1">BET:</span>
        <button class="bet-btn" data-bet="10" onclick="setBetMode(10)">10</button>
        <button class="bet-btn" data-bet="50" onclick="setBetMode(50)">50</button>
        <button class="bet-btn active" data-bet="100" onclick="setBetMode(100)">100</button>
        <button class="bet-btn" data-bet="500" onclick="setBetMode(500)">500</button>
        <button class="bet-btn" data-bet="1000" onclick="setBetMode(1000)">1000</button>
        <button class="bet-btn all-in" data-bet="ALL_IN" onclick="setBetMode('ALL_IN')">🔥 ALL IN</button>
        <div class="h-6 w-[1px] bg-white/20 mx-1"></div>
        <button id="uiSpinBtn" class="spin-cta-btn" onclick="QuickPullAndSpin()">PULL LEVER / SPIN</button>
      </div>
    </div>

  </div>

  <script>
    /* ============================================================================
       1. GAME STATE, BETTING TIERS & WEB AUDIO SYNTHESIZER
       ============================================================================ */
    const BET_TIERS = [10, 50, 100, 500, 1000, 'ALL_IN'];
    let credits = 1000;
    let selectedBetMode = 100;
    let lastWinAmount = 0;
    let isSpinning = false;
    let isMuted = false;

    function getActiveBetAmount() {
      if (selectedBetMode === 'ALL_IN') return Math.max(0, credits);
      return Math.min(credits, selectedBetMode);
    }

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSynthTone(freq, type = 'triangle', duration = 0.08, gainVal = 0.12) {
      if (isMuted) return;
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(gainVal, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function playSynthChord(freqs, type = 'triangle', duration = 0.18, gainVal = 0.11) {
      freqs.forEach((f, idx) => {
        setTimeout(() => playSynthTone(f, type, duration, gainVal), idx * 42);
      });
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById('muteBtn').textContent = isMuted ? '🔇 Muted' : '🔊 SFX';
    }

    function setStatus(text) {
      document.getElementById('statusTicker').textContent = text;
    }

    /* ============================================================================
       2. THREE.JS RENDERER & PROCEDURAL STUDIO HDRI ENVIRONMENT (PMREMGenerator)
       ============================================================================ */
    const mount = document.getElementById('webgl-mount');
    const scene = new THREE.Scene();

    // Crisp, close-up perspective camera so reels, buttons, and joystick are crystal clear
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    const camTargetPos = new THREE.Vector3(0.68, 0.22, 6.25);
    const camLookTarget = new THREE.Vector3(0.24, 0.08, 0.15);
    camera.position.copy(camTargetPos);
    camera.lookAt(camLookTarget);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    mount.appendChild(renderer.domElement);

    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

    // Build a procedural Studio HDRI Reflection Environment via PMREMGenerator
    // with balanced contrast so gold and gunmetal look rich without washing out
    function buildStudioEnvironment() {
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileCubemapShader();

      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x06040a);

      // Overhead studio softbox
      const topBox = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 20),
        new THREE.MeshBasicMaterial({ color: 0xffe8b3, side: THREE.DoubleSide })
      );
      topBox.position.set(0, 12, 0);
      topBox.rotation.x = Math.PI / 2;
      envScene.add(topBox);

      // Warm Las Vegas Gold Left Strip
      const leftStrip = new THREE.Mesh(
        new THREE.PlaneGeometry(16, 10),
        new THREE.MeshBasicMaterial({ color: 0xd4af37, side: THREE.DoubleSide })
      );
      leftStrip.position.set(-12, 3, 4);
      leftStrip.rotation.y = Math.PI / 2;
      envScene.add(leftStrip);

      // Warm Amber Right Strip
      const rightStrip = new THREE.Mesh(
        new THREE.PlaneGeometry(16, 10),
        new THREE.MeshBasicMaterial({ color: 0xb45309, side: THREE.DoubleSide })
      );
      rightStrip.position.set(12, 3, 4);
      rightStrip.rotation.y = -Math.PI / 2;
      envScene.add(rightStrip);

      // Subtle Cool Rim Accent
      const backStrip = new THREE.Mesh(
        new THREE.PlaneGeometry(18, 8),
        new THREE.MeshBasicMaterial({ color: 0x1e293b, side: THREE.DoubleSide })
      );
      backStrip.position.set(0, 6, -12);
      envScene.add(backStrip);

      const envRT = pmremGenerator.fromScene(envScene, 0.04);
      scene.environment = envRT.texture;
      pmremGenerator.dispose();
    }
    buildStudioEnvironment();

    // Direct Scene Lights — balanced for deep casino contrast with zero reel glare hotspot
    const ambientLight = new THREE.AmbientLight(0xfff5e4, 0.42);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffe8bf, 1.25);
    keyLight.position.set(5, 9, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.35);
    fillLight.position.set(-6, 3, 4);
    scene.add(fillLight);

    const cabinetGlowLight = new THREE.PointLight(0xf59e0b, 0.9, 10);
    cabinetGlowLight.position.set(0, 2.5, 2.2);
    scene.add(cabinetGlowLight);

    const leverHighlightLight = new THREE.PointLight(0xff3344, 1.1, 6);
    leverHighlightLight.position.set(3.0, 1.2, 2.2);
    scene.add(leverHighlightLight);

    /* ============================================================================
       3. HIGH-CONTRAST CASINO PBR MATERIALS (DARK CHROME, 24K GOLD, OBSIDIAN-CRIMSON)
       ============================================================================ */
    const mirrorChromeMat = new THREE.MeshStandardMaterial({
      color: 0x3f3f46,
      metalness: 0.85,
      roughness: 0.2,
      envMapIntensity: 1.0
    });

    const gold24kMat = new THREE.MeshStandardMaterial({
      color: 0xd4af37,
      metalness: 0.88,
      roughness: 0.22,
      envMapIntensity: 1.1
    });

    const brushedObsidianMat = new THREE.MeshStandardMaterial({
      color: 0x0d0b14,
      metalness: 0.7,
      roughness: 0.35,
      envMapIntensity: 0.8
    });

    const crimsonLacquerMat = new THREE.MeshStandardMaterial({
      color: 0x1a0509,
      metalness: 0.65,
      roughness: 0.35,
      envMapIntensity: 0.75
    });

    const gunmetalDrumMat = new THREE.MeshStandardMaterial({
      color: 0x11131a,
      metalness: 0.8,
      roughness: 0.35,
      envMapIntensity: 0.6
    });

    const rubberBootMat = new THREE.MeshStandardMaterial({
      color: 0x121216,
      metalness: 0.1,
      roughness: 0.75
    });

    /* ============================================================================
       4. HIGH-DPI UPRIGHT VECTOR CASINO SYMBOL ARTWORK GENERATOR (512x340)
       ============================================================================ */
    const SYMBOL_DEFS = [
      { id: 'SEVEN',   name: 'LUCKY 777', mult: 50 },
      { id: 'DIAMOND', name: 'DIAMOND',   mult: 25 },
      { id: 'BAR',     name: 'TRIPLE BAR',mult: 20 },
      { id: 'BELL',    name: 'GOLD BELL', mult: 15 },
      { id: 'CLOVER',  name: 'CLOVER',    mult: 10 },
      { id: 'CHERRY',  name: 'CHERRIES',  mult: 5  }
    ];
    const SYM_BY_ID = {};
    SYMBOL_DEFS.forEach(s => { SYM_BY_ID[s.id] = s; });

    // 12 stops per cylindrical drum
    const REEL_STRIP = [
      'SEVEN', 'CHERRY', 'BELL', 'DIAMOND',
      'CLOVER', 'BAR', 'SEVEN', 'CHERRY',
      'CLOVER', 'BELL', 'CHERRY', 'DIAMOND'
    ];
    const STOP_COUNT = REEL_STRIP.length; // 12
    const STOP_ANGLE = (Math.PI * 2) / STOP_COUNT;

    const symbolTextureCache = {};

    function drawStarSparkle(ctx, cx, cy, outerR, innerR, points = 4, color = '#ffffff') {
      ctx.save();
      ctx.beginPath();
      for (let i = 0; i < points * 2; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const a = (i * Math.PI) / points;
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    function createHighDPISymbolTexture(symId) {
      if (symbolTextureCache[symId]) return symbolTextureCache[symId];

      const W = 512;
      const H = 340;
      const c = document.createElement('canvas');
      c.width = W;
      c.height = H;
      const ctx = c.getContext('2d');

      // Rich warm ivory/gold radial casino card background (#fffbeb to #fde68a)
      const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 18, W / 2, H / 2, 285);
      bgGrad.addColorStop(0, '#fffbeb');
      bgGrad.addColorStop(0.7, '#fde68a');
      bgGrad.addColorStop(1, '#f59e0b');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // Subtle warm sunburst rays
      ctx.save();
      ctx.translate(W / 2, H / 2 - 12);
      ctx.fillStyle = 'rgba(217, 119, 6, 0.08)';
      for (let i = 0; i < 16; i++) {
        ctx.rotate((Math.PI * 2) / 16);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(320, -18);
        ctx.lineTo(320, 18);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Crisp inner & outer borders (#b45309)
      ctx.strokeStyle = '#78350f';
      ctx.lineWidth = 10;
      ctx.strokeRect(5, 5, W - 10, H - 10);
      ctx.strokeStyle = '#b45309';
      ctx.lineWidth = 4;
      ctx.strokeRect(14, 14, W - 28, H - 28);

      // Upright Vector Artwork per Symbol
      if (symId === 'SEVEN') {
        const drawVegasSeven = (cx, cy, scale, angle) => {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(angle);
          ctx.scale(scale, scale);

          const define7Path = () => {
            ctx.beginPath();
            ctx.moveTo(-85, -95);
            ctx.lineTo(90, -95);
            ctx.lineTo(90, -48);
            ctx.bezierCurveTo(42, 0, 12, 55, -2, 105);
            ctx.lineTo(-58, 105);
            ctx.bezierCurveTo(-40, 45, -5, -12, 34, -52);
            ctx.lineTo(-85, -52);
            ctx.closePath();
          };

          // 3D Extrusion Shadow
          ctx.save();
          ctx.translate(8, 12);
          define7Path();
          ctx.fillStyle = '#2a0404';
          ctx.fill();
          ctx.restore();

          // Gold Metallic Outer Bevel
          define7Path();
          ctx.lineWidth = 18;
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#d97706';
          ctx.stroke();

          // Crimson Candy Gradient Fill
          const redGrad = ctx.createLinearGradient(0, -95, 0, 105);
          redGrad.addColorStop(0, '#ff3b3b');
          redGrad.addColorStop(0.45, '#dc2626');
          redGrad.addColorStop(1, '#7f1d1d');
          ctx.fillStyle = redGrad;
          ctx.fill();

          // Inner Gold Rim
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#fef08a';
          ctx.stroke();
          ctx.restore();
        };

        drawVegasSeven(145, 142, 0.68, -0.14);
        drawVegasSeven(367, 142, 0.68, 0.14);
        drawVegasSeven(256, 134, 0.96, 0);

        drawStarSparkle(ctx, 180, 56, 22, 5, 4, '#ffffff');
        drawStarSparkle(ctx, 340, 68, 18, 4, 4, '#ffffff');

        // Bottom Jackpot Ribbon
        ctx.fillStyle = '#450a0a';
        ctx.fillRect(96, 262, 320, 46);
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 4;
        ctx.strokeRect(96, 262, 320, 46);
        ctx.font = '900 28px Orbitron, sans-serif';
        ctx.fillStyle = '#fef08a';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('JACKPOT 50×', 256, 286);
      }

      else if (symId === 'DIAMOND') {
        const cx = 256, cy = 136;
        ctx.save();
        ctx.fillStyle = 'rgba(3, 105, 161, 0.35)';
        ctx.beginPath();
        ctx.moveTo(cx - 78, cy - 68);
        ctx.lineTo(cx + 78, cy - 68);
        ctx.lineTo(cx + 118, cy - 18);
        ctx.lineTo(cx, cy + 104);
        ctx.lineTo(cx - 118, cy - 18);
        ctx.closePath();
        ctx.fill();

        const dGrad = ctx.createLinearGradient(cx - 110, cy - 75, cx + 110, cy + 95);
        dGrad.addColorStop(0, '#38bdf8');
        dGrad.addColorStop(0.5, '#0284c7');
        dGrad.addColorStop(1, '#1e3a8a');
        ctx.fillStyle = dGrad;
        ctx.beginPath();
        ctx.moveTo(cx - 76, cy - 74);
        ctx.lineTo(cx + 76, cy - 74);
        ctx.lineTo(cx + 116, cy - 22);
        ctx.lineTo(cx, cy + 96);

    // Create a single reusable curved tile geometry bent around the X-axis
    // so PlaneGeometry's standard UVs stay 100% UPRIGHT (never rotated 90 degrees!)
    function createCurvedReelTileGeometry() {
      const arcHeight = 2 * REEL_RADIUS * Math.sin(STOP_ANGLE / 2) * 0.98;
      const geo = new THREE.PlaneGeometry(REEL_WIDTH * 0.94, arcHeight, 1, 16);
      const pos = geo.attributes.position;
      const norm = geo.attributes.normal;

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const localTheta = (vy / (arcHeight / 2)) * (STOP_ANGLE / 2);
        pos.setXYZ(
          i,
          vx,
          Math.sin(localTheta) * REEL_RADIUS,
          Math.cos(localTheta) * REEL_RADIUS
        );
        norm.setXYZ(i, 0, Math.sin(localTheta), Math.cos(localTheta));
      }
      geo.computeVertexNormals();
      return geo;
    }

    /* ============================================================================
       9. JOYSTICK DRAG PHYSICS, SPRING RETURN & RAYCAST INTERACTION

    const ARM_REST_ANGLE = -0.14;       // Slight backward rest angle
    const ARM_MAX_PULL_ANGLE = 1.28;    // Full forward/downward pull (~80 degrees)
    const ARM_TRIGGER_THRESHOLD = 0.58; // Pull past 58% triggers spin!

    let isDraggingArm = false;

    leverPivot.rotation.x = ARM_REST_ANGLE;

    function syncArmVisuals(ratio) {
      const clamped = Math.max(0, Math.min(1, ratio));
      leverPivot.rotation.x = ARM_REST_ANGLE + clamped * (ARM_MAX_PULL_ANGLE - ARM_REST_ANGLE);

      // Compress rubber dust boot slightly as arm bends forward
      bootRings.forEach((ring, idx) => {
        ring.position.z = clamped * idx * 0.014;
      });

      // Light up the 3D LED Pull-Force Arc on the gearbox
      pullArcLEDs.forEach(led => {
        led.mat.emissiveIntensity = clamped >= led.threshold - 0.05 ? 1.8 : 0.08;
      });

      // Update HTML Right-Side Tension Gauge
      const pct = Math.round(clamped * 100);
      document.getElementById('tensionFill').style.height = `${pct}%`;
      document.getElementById('tensionPct').textContent = `${pct}%`;
    }

    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    let isOrbiting = false;
    let orbitLastX = 0;
    let orbitLastY = 0;

    function updatePointerNDC(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
      pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
      return { clientX, clientY };
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.interactive')) return;
      const { clientX, clientY } = updatePointerNDC(e);

      raycaster.setFromCamera(pointerNDC, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes, true);

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        const action = hit.userData.action;

        if (action === 'JOYSTICK' && !isSpinning) {
          isDraggingArm = true;
          dragStartClientY = clientY;
          dragStartTimestamp = performance.now();
          armSpringVelocity = 0;
          lastRatchetTooth = 0;
          ballHandleMat.emissiveIntensity = 0.85;
          document.body.style.cursor = 'grabbing';
          playSynthTone(240, 'sine', 0.05, 0.1);
          return;
        }

        if (action === 'BET' && !isSpinning) {
          setBetMode(hit.userData.value);
          return;
        }

        if (action === 'SPIN_BUTTON' && !isSpinning) {
          QuickPullAndSpin();
          return;
        }
      }

      // Allow subtle camera inspection orbit when dragging background
      isOrbiting = true;
      orbitLastX = clientX;
      orbitLastY = clientY;
    });

    window.addEventListener('pointermove', (e) => {
      const { clientX, clientY } = updatePointerNDC(e);

      if (isDraggingArm) {
        const dy = clientY - dragStartClientY;
        // 175px downward drag = 100% full mechanical pull
        armPullRatio = Math.max(0, Math.min(1, dy / 175));
        syncArmVisuals(armPullRatio);

        // Realistic Ratchet Gear Teeth Clicks every 8% pull
        const tooth = Math.floor(armPullRatio * 12);
        if (tooth !== lastRatchetTooth) {
          lastRatchetTooth = tooth;
          playSynthTone(170 + tooth * 28, 'sawtooth', 0.032, 0.12);
        }

        // Auto-release & fire when pulled all the way to the bottom stop (98%+)
        if (armPullRatio >= 0.98 && !isSpinning) {
          completeArmRelease(true);
        }
        return;
      }

      if (isOrbiting) {
        const dx = (clientX - orbitLastX) * 0.006;
        const dy = (clientY - orbitLastY) * 0.005;
        orbitLastX = clientX;
        orbitLastY = clientY;
        camTargetPos.x = Math.max(-2.6, Math.min(3.2, camTargetPos.x - dx * 3.5));
        camTargetPos.y = Math.max(-0.6, Math.min(2.2, camTargetPos.y + dy * 2.5));
        return;
      }

      // Hover state feedback
      raycaster.setFromCamera(pointerNDC, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes, true);
      if (intersects.length > 0 && !isSpinning) {
        document.body.style.cursor = 'grab';
        if (intersects[0].object.userData.action === 'JOYSTICK') {
          ballHandleMat.emissiveIntensity = 0.65;
        }
      } else {
        document.body.style.cursor = 'default';
        ballHandleMat.emissiveIntensity = 0.32;
      }
    });

    function completeArmRelease(forceSpin = false) {
      if (!isDraggingArm) return;
      isDraggingArm = false;
      ballHandleMat.emissiveIntensity = 0.32;

      const elapsedTap = performance.now() - dragStartTimestamp;
      const isQuickClick = elapsedTap < 230 && armPullRatio < 0.18;

      if (forceSpin || armPullRatio >= ARM_TRIGGER_THRESHOLD || isQuickClick) {
        if (isQuickClick) {
          armPullRatio = 1.0;
          syncArmVisuals(1.0);

        executeReelSpin();

        setStatus('🕹️ Pull the 3D joystick past 60% (or tap it) to engage the reels!');
      }
    }

    window.addEventListener('pointerup', () => {

      isOrbiting = false;
    });

    /* ============================================================================

    function setBetMode(mode) {

      if (mode === 'ALL_IN') {

    function refreshAllUI() {

        selectedBetMode === 'ALL_IN'
          ? `ALL IN (${activeBet.toLocaleString()})`

      deckButtons3D.forEach(b => {

    function forceJackpot777() {
      if (isSpinning) return;
      // Stops 0 and 6 on REEL_STRIP are both 'SEVEN'
      QuickPullAndSpin([0, 6, 0]);
    }

    function executeReelSpin(forcedStops = null) {
      if (isSpinning) return;

      if (credits <= 0) {
        credits = 1000;
        setStatus('🎁 Complimentary House Refill: +1,000 Credits!');
      }

      const wager = getActiveBetAmount();
      if (wager <= 0) return;

      isSpinning = true;
      const isAllInSpin = selectedBetMode === 'ALL_IN' || wager === credits;
      credits -= wager;
      lastWinAmount = 0;

      // Reset payline laser & segment emissive levels
      paylineLaserMat.color.setHex(0xff2a2a);
      paylineLaserMat.emissive.setHex(0xff2222);
      reels.forEach(r => r.segments.forEach(s => { s.mat.emissiveIntensity = 0.28; }));

      // Depress 3D Spin button momentarily
      spinCapMesh.position.y = 0.19;
      setTimeout(() => { spinCapMesh.position.y = 0.24; }, 220);

      refreshAllUI();

      // Heavy mechanical latch clunk
      playSynthChord([135, 92, 280], 'sawtooth', 0.12, 0.18);
      setStatus(
        isAllInSpin
          ? `🔥 ALL IN (${wager.toLocaleString()} CREDITS)! Reels rolling...`
          : `🎰 Spinning for ${wager.toLocaleString()} credits...`
      );

      const chosenStops = forcedStops || [
        Math.floor(Math.random() * STOP_COUNT),
        Math.floor(Math.random() * STOP_COUNT),
        Math.floor(Math.random() * STOP_COUNT)
      ];

      const spinTimes = [1500, 2100, 2750];
      const extraTurns = [6, 8, 11];

      reels.forEach((reel, rIdx) => {
        const stopIdx = chosenStops[rIdx];
        reel.targetStop = stopIdx;

        const startRot = reel.angle;
        const baseFullTurns = Math.ceil(startRot / (Math.PI * 2)) * (Math.PI * 2);
        const targetRot = baseFullTurns + extraTurns[rIdx] * (Math.PI * 2) + stopIdx * STOP_ANGLE;

        const duration = spinTimes[rIdx];
        const tStart = performance.now();
        let lastClickStep = Math.floor(startRot / STOP_ANGLE);

        function updateReelSpin(now) {
          const elapsed = now - tStart;
          const t = Math.min(1, elapsed / duration);

          // Authentic wind-up + mechanical overshoot bounce when locking into place
          let eased;
          if (t < 0.065) {
            eased = -0.014 * Math.sin((t / 0.065) * Math.PI);
          } else {
            const st = (t - 0.065) / 0.935;
            const c1 = 1.38;
            const c3 = c1 + 1;
            eased = 1 + c3 * Math.pow(st - 1, 3) + c1 * Math.pow(st - 1, 2);
          }

          const currentRot = startRot + (targetRot - startRot) * eased;
          reel.group.rotation.x = currentRot;

          const stepNow = Math.floor(currentRot / STOP_ANGLE);
          if (stepNow !== lastClickStep && t < 0.95) {
            lastClickStep = stepNow;
            playSynthTone(250 + rIdx * 45, 'sine', 0.022, 0.045);
          }

          if (t < 1) {
            requestAnimationFrame(updateReelSpin);
          } else {
            reel.angle = targetRot % (Math.PI * 2);
            reel.group.rotation.x = reel.angle;
            // Solid mechanical drum stop thud
            playSynthTone(150 + rIdx * 55, 'triangle', 0.14, 0.24);

            if (rIdx === 2) {
              evaluatePayline(chosenStops, wager);
            }
          }
        }

        requestAnimationFrame(updateReelSpin);
      });
    }

    function evaluatePayline(stops, wager) {
      const landedSyms = stops.map(idx => SYM_BY_ID[REEL_STRIP[idx]]);
      const [s0, s1, s2] = landedSyms;

      let winMult = 0;
      let winningReels = [];
      let bannerMsg = '';

      if (s0.id === s1.id && s1.id === s2.id) {
        winMult = s0.mult;
        winningReels = [0, 1, 2];
        bannerMsg = s0.id === 'SEVEN'
          ? `🚨 GRAND 777 VEGAS JACKPOT! ${winMult}× PAYOUT! 🚨`
          : `✨ TRIPLE ${s0.name}! ${winMult}× PAYOUT! ✨`;
      } else if (landedSyms.filter(s => s.id === 'SEVEN').length === 2) {
        winMult = 5;
        winningReels = landedSyms.map((s, i) => (s.id === 'SEVEN' ? i : -1)).filter(i => i !== -1);
        bannerMsg = `⚡ DOUBLE LUCKY 777s! 5× Payout!`;
      } else {
        const cherryCount = landedSyms.filter(s => s.id === 'CHERRY').length;
        if (cherryCount === 2) {
          winMult = 2;
          winningReels = landedSyms.map((s, i) => (s.id === 'CHERRY' ? i : -1)).filter(i => i !== -1);
          bannerMsg = `🍒 Twin Cherries! 2× Payout!`;
        } else if (cherryCount === 1) {
          winMult = 1;
          winningReels = landedSyms.map((s, i) => (s.id === 'CHERRY' ? i : -1)).filter(i => i !== -1);
          bannerMsg = `🍒 Single Cherry! 1× Bet Returned!`;
        }
      }

      if (winMult > 0) {
        const payout = wager * winMult;
        credits += payout;
        lastWinAmount = payout;
        setStatus(`${bannerMsg} (+${payout.toLocaleString()} Credits!)`);

        // Turn Payline Laser Emerald Green
        paylineLaserMat.color.setHex(0x4ade80);
        paylineLaserMat.emissive.setHex(0x22c55e);

        // Illuminate winning curved segments on the 3D drums
        winningReels.forEach(rIdx => {
          const stopIdx = stops[rIdx];
          reels[rIdx].segments[stopIdx].mat.emissiveIntensity = 1.05;
        });

        const isJackpotOrBig = winMult >= 15 || payout >= 1000;
        playSynthChord(
          isJackpotOrBig
            ? [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98]
            : [440, 554.37, 659.25, 880],
          'square',
          0.18,
          0.14
        );
        dispense3DCoins(isJackpotOrBig ? 75 : 28);
      } else {
        if (credits <= 0) {
          setStatus(`💥 BUSTED! Click "+1,000 REBUY" or pull the 3D joystick for a free house refill!`);
        } else {
          setStatus(`Result: ${s0.name} · ${s1.name} · ${s2.name} — Pull the 3D joystick again!`);
        }
      }

      isSpinning = false;
      refreshAllUI();
    }

    const coinGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.032, 20);

    function setCameraView(view) {
      ['Play', 'Lever', 'Front'].forEach(v => {
        const btn = document.getElementById(`cam${v}`);
        const active = v.toLowerCase() === view;
        btn.className = active
          ? 'px-3 py-1 rounded-full bg-amber-400 text-black font-bold transition'
          : 'px-3 py-1 rounded-full text-amber-200 hover:bg-white/10 transition';
      });

      if (view === 'lever') {
        // Close-up angled focus on the 3D mechanical joystick & gearbox
        camTargetPos.set(2.35, 0.35, 5.15);
        camLookTarget.set(1.15, 0.15, 0.2);
      } else if (view === 'front') {
        // Dead-center straight-on casino view
        camTargetPos.set(0, 0.22, 6.2);
        camLookTarget.set(0, 0.08, 0.15);
      } else {
        // Balanced Close-Up 3D Play view
        camTargetPos.set(0.68, 0.22, 6.25);
        camLookTarget.set(0.24, 0.08, 0.15);
      }
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      // Smooth camera interpolation
      camera.position.lerp(camTargetPos, 0.08);
      camera.lookAt(camLookTarget);

      // Chasing Marquee Light Bulbs animation
      marqueeBulbs.forEach(b => {
        const wave = Math.sin(elapsed * 7 - b.idx * 0.65);
        b.mat.emissiveIntensity = isSpinning
          ? (wave > 0 ? 2.4 : 0.25)
          : 1.1 + 0.7 * wave;
      });

      // Idle pulsing grab-halo around the 3D Joystick Ball
      if (!isDraggingArm && !isSpinning) {
        grabHaloRing.visible = true;
        const pulse = 1 + Math.sin(elapsed * 4) * 0.09;
        grabHaloRing.scale.set(pulse, pulse, 1);
        grabHaloMat.opacity = 0.35 + Math.sin(elapsed * 4) * 0.22;
        grabHaloRing.lookAt(camera.position);
      } else {
        grabHaloRing.visible = false;
      }

      // Damped Harmonic Spring-Return Physics on the 3D Joystick Arm
      if (!isDraggingArm && armPullRatio > 0.0005) {
        const springAccel = -0.22 * armPullRatio;
        armSpringVelocity = (armSpringVelocity + springAccel) * 0.76;
        armPullRatio = Math.max(0, armPullRatio + armSpringVelocity);
        syncArmVisuals(armPullRatio);
      }

      // Update 3D Gold Coins bouncing in the Coin Tray
      for (let i = activeCoins.length - 1; i >= 0; i--) {
        const c = activeCoins[i];
        c.life++;
        c.mesh.position.x += c.vx;
        c.mesh.position.y += c.vy;
        c.mesh.position.z += c.vz;
        c.vy -= 0.0065; // Gravity
        c.mesh.rotation.x += c.rx;
        c.mesh.rotation.y += c.ry;

        // Bounce inside the stainless-steel coin tray floor
        if (c.mesh.position.y < -2.18) {
          c.mesh.position.y = -2.18;
          c.vy = -c.vy * 0.48;
          c.vx *= 0.78;
          c.vz *= 0.78;
          c.bounces++;
        }

        if (c.life > 190) {
          cabinetGroup.remove(c.mesh);
          activeCoins.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    refreshAllUI();
    animate();
  </script>
</body>
</html>
